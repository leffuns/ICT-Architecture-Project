services:
  # Keycloak's eigen database
  keycloak-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD_FILE: /run/secrets/kc_db_password
    secrets:
      - kc_db_password
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    networks:
      - auth-net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
        max_replicas_per_node: 1
      restart_policy:
        condition: on-failure

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    command: ["start", "--import-realm"]
    environment:
      # DB
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD_FILE: /run/secrets/kc_db_password
      # Hostname / HTTP
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      # Bootstrap admin (alleen voor first run / de Keycloak UI)
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/kc_admin_password
      # Health endpoint
      KC_HEALTH_ENABLED: "true"
    secrets:
      - kc_db_password
      - kc_admin_password
    configs:
      - source: realm-export
        target: /opt/keycloak/data/import/sportbooking-realm.json
    ports:
      - "8080:8080"
    networks:
      - auth-net
    depends_on:
      - keycloak-db
    deploy:
      replicas: 2
      placement:
        max_replicas_per_node: 1
      restart_policy:
        condition: on-failure
      update_config:
        order: start-first

  # Mini-versie van de toekomstige monoliet.
  protected-service:
    image: python:3.12-slim
    working_dir: /app
    command:
      - sh
      - -c
      - "cp /cfg/app.py /cfg/requirements.txt /app/
         && pip install --no-cache-dir -r requirements.txt
         && uvicorn app:app --host 0.0.0.0 --port 9000"
    configs:
      - source: app-py
        target: /cfg/app.py
      - source: requirements-txt
        target: /cfg/requirements.txt
    ports:
      - "9000:9000"
    networks:
      - auth-net
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure

networks:
  auth-net:
    driver: overlay

volumes:
  keycloak-db-data:

secrets:
  kc_db_password:
    external: true
  kc_admin_password:
    external: true

configs:
  realm-export:
    file: ./realm-export.json
  app-py:
    file: ./protected-service/app.py
  requirements-txt:
    file: ./protected-service/requirements.txt