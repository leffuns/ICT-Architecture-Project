services:
  # Keycloak's eigen database (om accounts te bewaren)
  keycloak-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    networks:
      - auth-net

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    command: ["start-dev", "--import-realm"]
    environment:
      # DB
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      # Bootstrap admin (alleen voor first run / de Keycloak UI)
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    configs:
      - source: realm-config
        target: /opt/keycloak/data/import/realm.json
    ports:
      - "8080:8080"
    networks:
      - auth-net
    depends_on:
      - keycloak-db

  # Mini-versie van de toekomstige monoliet.
  backend:
    image: python:3.12-slim
    working_dir: /app
    command:
      - sh
      - -c
      - "pip install --quiet fastapi uvicorn 'pyjwt[crypto]' requests && uvicorn app:app --host 0.0.0.0 --port 9000"
    configs:
      - source: backend-code
        target: /app/app.py
    ports:
      - "9000:9000"
    networks:
      - auth-net
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure

networks:
  auth-net:

configs:
  realm-config:
    file: ./realm-export.json
  backend-code:
    file: ./app.py