# Deploy met: docker stack deploy -f poc.yaml poc
# Deze stack bevat:
#   - booking-api: Flask API (Microservice) met meerdere replicas
#   - db: MySQL 8.0 database
#   - loadtest: Container voor het uitvoeren van load tests

version: "3.8"

services:
  # Booking API - De microservice die horizontaal geschaald wordt
  booking-api:
    image: poc-booking-api:latest
    ports:
      - "8080:5000"
    deploy:
      # Start met 3 replicas. Schaal op/af met:
      #   docker service scale poc_booking-api=<N>
      replicas: 3
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    environment:
      - DB_HOST=db
      - DB_USER=poc
      - DB_PASSWORD=poc
      - DB_NAME=bookings
    networks:
      - poc-network
    depends_on:
      - db

  # MySQL Database
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: bookings
      MYSQL_USER: poc
      MYSQL_PASSWORD: poc
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db-data-mysql:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "poc", "-ppoc"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - poc-network

  # Test Container
  loadtest:
    image: poc-loadtest:latest
    deploy:
      replicas: 1
      restart_policy:
        condition: none
      placement:
        constraints:
          - node.role == manager
    environment:
      - API_URL=http://booking-api:5000
    networks:
      - poc-network
    depends_on:
      - booking-api

networks:
  poc-network:
    driver: overlay

volumes:
  db-data-mysql:
